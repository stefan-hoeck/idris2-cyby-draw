[custom.all.chem]
type   = "git"
url    = "https://github.com/stefan-hoeck/idris2-chem"
commit = "latest:gen2d"
ipkg   = "chem.ipkg"

[custom.all.chem-generators]
type   = "git"
url    = "https://github.com/stefan-hoeck/idris2-chem"
commit = "latest:gen2d"
ipkg   = "chem-generators/chem-generators.ipkg"

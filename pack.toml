ipkg   = "chem-generators/chem-generators.ipkg"

[custom.all.async-dom]
type   = "git"
url    = "https://github.com/stefan-hoeck/idris2-async-dom"
commit = "latest:main"
ipkg   = "async-dom.ipkg"

[custom.all.cyby-draw]
type    = "local"
path    = "."
ipkg    = "cyby-draw.ipkg"

[custom.all.cyby-draw-app]
type    = "local"
path    = "app"
ipkg    = "cyby-draw-app.ipkg"

[custom.all.cyby-draw-word-addin]
type    = "local"
path    = "word-addin"
ipkg    = "cyby-draw-word-addin.ipkg"

[custom.all.indexed-graph]
